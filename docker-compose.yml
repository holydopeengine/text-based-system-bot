services:

  postgres:
    image: postgres:18
    container_name: fastfood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastfood
      POSTGRES_USER: fastfood
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql

  kestra-postgres:
    image: postgres:18
    container_name: kestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
    volumes:
      - ./kestra_postgres_data:/var/lib/postgresql

  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    restart: unless-stopped
    user: "root"
    command: server standalone
    ports:
      - "8080:8080"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driver-class-name: org.postgresql.Driver
            username: kestra
            password: kestra

        kestra:
          repository:
            type: postgres

          queue:
            type: postgres

          storage:
            type: local
            local:
              base-path: "/app/storage"

          tasks:
            tmp-dir:
              path: "/tmp/kestra-wd/tmp"

          url: "http://localhost:8080/"
    volumes:
      - ./kestra:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    depends_on:
      - kestra-postgres

  n8n:
    image: n8nio/n8n:latest
    container_name: fastfood-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Africa/Lagos
      TZ: Africa/Lagos
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - postgres